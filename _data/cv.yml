  sections:
    Experience:
      - company: PROMISE – LAIMBIO
        url: http://promise.urjc.es/en/
        position: Machine Learning and Computer Vision Researcher
        location: Madrid, Spain
        start_date: 2025-10
        end_date: present
        summary: Research focused on generative deep learning methods for 3D computer vision, with applications to medical imaging. This work includes RARF, a rectified-flow model achieving 5th place at the BraTS 2026 Challenge, and SynthRCT, a conditional deformation-generation framework presented as an oral at MIART @ MICCAI 2026; both resulted in peer-reviewed publications.

      - company: Google Summer of Code – DIPY
        url: https://tomasguija.github.io/gsoc-2026-dipy/
        position: Open Source Contributor, Python Software Foundation
        location: Remote
        start_date: 2026-05
        end_date: 2026-08
        summary: Contributed to DIPY through GSoC 2026, implementing and benchmarking new similarity metrics for deformable medical image registration, alongside performance and robustness improvements to the registration framework. [Project Page](https://tomasguija.github.io/gsoc-2026-dipy/)

      - company: ML Circle
        url: https://mlcircle.org/
        position: Machine Learning Researcher
        location: Madrid, Spain
        start_date: 2025-01
        end_date: 2025-10
        summary: "Machine Learning researcher working on R&D projects and technology consulting, with experience designing generative AI models and Transformer-based architectures. My research focused on generative modeling for vector graphics, leading to the publication of “DesigNet: Learning to Draw Vector Graphics as Designers Do” in Computers & Graphics."

